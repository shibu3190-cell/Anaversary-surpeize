<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Surprise</title>
    <!-- Elegant Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Floating Hearts Background (Global) -->
    <div class="heart-bg" id="heart-container"></div>

    <!-- 1. Landing Screen -->
    <section id="screen-landing" class="screen active">
        <div class="bg-image-container" id="landing-bg"></div>
        <div class="overlay"></div>
        <div class="content">
            <h1 id="conf-title" class="fade-in"></h1>
            <p id="conf-landing-msg" class="fade-in delay-1"></p>
            <button class="primary-btn fade-in delay-2" onclick="showScreen('screen-password')">Enter</button>
        </div>
    </section>

    <!-- 2. Password Gate -->
    <section id="screen-password" class="screen">
        <div class="glass-card">
            <h2>Unlock the Magic</h2>
            <p>Please enter your secret code</p>
            <input type="password" id="pass-input" placeholder="•••••••" inputmode="numeric">
            <button class="primary-btn" onclick="validatePassword()">Unlock</button>
            <p id="error-msg" class="error">Incorrect code. Try again, love.</p>
        </div>
    </section>

    <!-- 3. Unlocked Screen -->
    <section id="screen-main" class="screen">
        <div class="main-scrollable">
            <div class="personal-note glass-card">
                <h2 id="conf-personal-title"></h2>
                <p id="conf-personal-msg">Loading your message...</p>
            </div>

            <!-- Image Slider -->
            <div class="slider-container" id="slider">
                <div class="slider-wrapper" id="slider-wrapper"></div>
                <button class="nav-btn prev" onclick="moveSlider(-1)">❮</button>
                <button class="nav-btn next" onclick="moveSlider(1)">❯</button>
            </div>

            <!-- Reaction Game -->
            <div class="game-section glass-card">
                <h3>Catch My Heart</h3>
                <p>Score: <span id="score-val">0</span>/10</p>
                <div id="game-area">
                    <div id="game-target">💝</div>
                </div>
            </div>
        </div>

        <!-- Win Overlay -->
        <div id="win-overlay" class="win-overlay">
            <div class="glass-card">
                <h2 id="conf-win-msg"></h2>
                <button class="primary-btn" onclick="location.reload()">Replay</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
