<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen 1: Creator Form -->
  <div id="creatorScreen" class="screen">
    <div class="card">
      <h2>Create a Surprise</h2>
      <form id="creatorForm">
        <label for="titleInput">Occasion / Title</label>
        <input type="text" id="titleInput" placeholder="Happy Anniversary!" required>

        <label for="messageInput">Special Message</label>
        <textarea id="messageInput" rows="3" placeholder="Write your message here..." required></textarea>

        <label for="passwordInput">Secret Passcode</label>
        <input type="password" id="passwordInput" placeholder="Enter secret passcode" required>

        <label for="photoFiles">Select 3 Photos</label>
        <input type="file" id="photoFiles" multiple accept="image/*" required>

        <button type="submit" id="generateBtn">Create Surprise Link</button>
      </form>

      <div id="linkResult" class="hidden">
        <label style="margin-top: 15px;">Your link is ready to share:</label>
        <textarea id="generatedUrl" rows="4" readonly></textarea>
        <button id="copyBtn" type="button">Copy Link</button>
      </div>
    </div>
  </div>

  <!-- Screen 2: Password Gate Screen -->
  <div id="gateScreen" class="screen hidden">
    <div class="card">
      <h2>A Secret Surprise Awaits</h2>
      <p style="margin: 10px 0;">Enter the passcode to unlock:</p>
      <input type="password" id="unlockPasscode" placeholder="Enter passcode">
      <button id="unlockBtn" type="button">Unlock</button>
      <p id="gateError" class="error hidden">Incorrect passcode, try again!</p>
    </div>
  </div>

  <!-- Screen 3: Main Celebration Screen -->
  <div id="celebrationScreen" class="screen hidden">
    <h1 id="celebrationTitle"></h1>

    <div class="slider-container">
      <div class="slider">
        <img id="slide1" alt="Memory 1" class="slide active">
        <img id="slide2" alt="Memory 2" class="slide">
        <img id="slide3" alt="Memory 3" class="slide">
      </div>
    </div>

    <div class="card">
      <p id="displayMessage"></p>
    </div>

    <div class="game-section">
      <h3>Catch the Hearts!</h3>
      <p>Score 10 to reveal the final message. Current Score: <span id="scoreDisplay">0</span></p>
      <div id="gameArea">
        <div id="target">❤️</div>
      </div>
    </div>
  </div>

  <!-- Win Overlay -->
  <div id="winOverlay" class="overlay hidden">
    <div class="card modal">
      <h2>🎉 You Won! 🎉</h2>
      <p>You caught all the hearts! Wishing you endless happiness, love, and memories together!</p>
      <button id="closeOverlayBtn" type="button">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
