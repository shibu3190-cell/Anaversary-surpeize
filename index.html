<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Surprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SETUP SCREEN (Visible only to you) -->
    <section id="setup-screen" class="screen active">
        <div class="glass-card">
            <h1>Link Creator</h1>
            <p>Fill this out to create her surprise link.</p>
            <input type="text" id="setup-title" placeholder="Occasion (e.g. Happy Birthday)">
            <textarea id="setup-msg" placeholder="Your personal message..."></textarea>
            <input type="text" id="setup-pass" placeholder="Set a Password">
            <button class="primary-btn" onclick="generateLink()">Create & Copy Link</button>
            
            <div id="link-output" class="hidden">
                <p class="success-text">✅ Link Created & Copied!</p>
                <input type="text" id="share-url" readonly>
                <p style="font-size: 12px; color: #666;">Paste this link in WhatsApp/iMessage to send to her.</p>
            </div>
        </div>
    </section>

    <!-- LANDING SCREEN (Visible to her) -->
    <section id="landing-screen" class="screen hidden">
        <div id="landing-bg" class="full-bg"></div>
        <div class="overlay"></div>
        <div class="content">
            <h1 id="display-title"></h1>
            <p id="display-msg"></p>
            <button class="primary-btn" onclick="showPasswordGate()">Enter</button>
        </div>
    </section>

    <!-- PASSWORD GATE -->
    <section id="password-screen" class="screen hidden">
        <div class="glass-card">
            <h2>Unlock</h2>
            <p>Enter the secret code</p>
            <input type="password" id="pass-input" placeholder="•••••••" inputmode="numeric">
            <button class="primary-btn" onclick="checkPassword()">Unlock</button>
            <p id="error-msg" class="error">Incorrect password.</p>
        </div>
    </section>

    <!-- MAIN CONTENT -->
    <section id="main-content" class="screen hidden">
        <div class="scroll-container">
            <div class="glass-card">
                <h2 id="final-title"></h2>
                <p id="final-msg"></p>
            </div>

            <div class="slider">
                <div class="slider-wrapper" id="slider-wrapper">
                    <div class="slide"><img src="assets/photo1.jpg" onerror="imgErr(this)"><div class="caption">Forever</div></div>
                    <div class="slide"><img src="assets/photo2.jpg" onerror="imgErr(this)"><div class="caption">Always</div></div>
                    <div class="slide"><img src="assets/photo3.jpg" onerror="imgErr(this)"><div class="caption">Together</div></div>
                </div>
                <button class="nav-btn prev" onclick="moveSlide(-1)">❮</button>
                <button class="nav-btn next" onclick="moveSlide(1)">❯</button>
            </div>

            <div class="game-box glass-card">
                <h3>Catch the Heart</h3>
                <p>Score: <span id="score">0</span>/10</p>
                <div id="game-area"><div id="target">💝</div></div>
            </div>
        </div>
    </section>

    <div id="win-overlay" class="win-overlay hidden">
        <div class="glass-card">
            <h2>You're Amazing! 🎉</h2>
            <button class="primary-btn" onclick="location.reload()">View Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
