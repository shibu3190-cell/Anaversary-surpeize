<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Celebration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Landing Screen -->
    <section id="landing-screen" class="screen active">
        <div class="bg-fallback">🎉</div>
        <div id="landing-bg" class="full-bg"></div>
        <div class="overlay"></div>
        <div class="content">
            <h1 id="landing-title"></h1>
            <p id="landing-msg"></p>
            <button id="btn-enter" class="primary-btn">Enter</button>
        </div>
    </section>

    <!-- Password Gate -->
    <section id="password-screen" class="screen hidden">
        <div class="content">
            <h2>Security Check</h2>
            <p>Please enter the access code</p>
            <div class="input-container">
                <input type="password" id="pass-input" placeholder="•••••••" inputmode="numeric">
                <button id="btn-unlock" class="primary-btn">Unlock</button>
            </div>
            <div id="error-msg" class="error">Incorrect Password</div>
        </div>
    </section>

    <!-- Main Content -->
    <section id="main-content" class="screen hidden">
        <div class="scroll-container">
            <div class="message-block">
                <h2 id="main-title"></h2>
            </div>

            <!-- Image Slider -->
            <div class="slider" id="main-slider">
                <div class="slides-wrapper" id="slides-wrapper">
                    <!-- Injected by JS -->
                </div>
                <button class="nav-arrow prev" id="prev-btn">❮</button>
                <button class="nav-arrow next" id="next-btn">❯</button>
            </div>

            <!-- Reaction Game -->
            <div class="game-container">
                <h3>Catch the Magic</h3>
                <p>Tap 10 items to win! Score: <span id="score">0</span></p>
                <div id="game-board">
                    <div id="target" class="target-emoji">✨</div>
                </div>
            </div>
        </div>

        <!-- Win Overlay -->
        <div id="win-screen" class="win-overlay hidden">
            <div class="win-box">
                <h2 id="win-msg-display"></h2>
                <button onclick="location.reload()" class="primary-btn">Play Again</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
