<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anniversary Surprise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen 1: Creator Form (shows when no ?d= query param) -->
  <div id="creatorScreen" class="screen">
    <div class="card">
      <h2>Create a Surprise</h2>
      <form id="creatorForm">
        <label for="titleInput">Occasion / Title</label>
        <input type="text" id="titleInput" placeholder="Happy Anniversary!" required>

        <label for="messageInput">Special Message</label>
        <textarea id="messageInput" rows="4" placeholder="Write your heartfelt message here..." required></textarea>

        <label for="passwordInput">Secret Passcode</label>
        <input type="password" id="passwordInput" placeholder="Enter secret code" required>

        <button type="submit">Generate Link</button>
      </form>

      <div id="linkResult" class="hidden">
        <label>Share this link:</label>
        <input type="text" id="generatedUrl" readonly>
        <button id="copyBtn" type="button">Copy Link</button>
      </div>
    </div>
  </div>

  <!-- Screen 2: Password Gate -->
  <div id="gateScreen" class="screen hidden">
    <div class="card">
      <h2>A Secret Surprise Awaits</h2>
      <p>Enter the passcode to unlock:</p>
      <input type="password" id="unlockPasscode" placeholder="Enter passcode">
      <button id="unlockBtn" type="button">Unlock</button>
      <p id="gateError" class="error hidden">Incorrect passcode, try again!</p>
    </div>
  </div>

  <!-- Screen 3: Main Celebration & Content -->
  <div id="celebrationScreen" class="screen hidden">
    <h1 id="celebrationTitle"></h1>

    <!-- Image Slider -->
    <div class="slider-container">
      <div class="slider">
        <img src="assets/photo1.jpg" alt="Memory 1" class="slide active">
        <img src="assets/photo2.jpg" alt="Memory 2" class="slide">
        <img src="assets/photo3.jpg" alt="Memory 3" class="slide">
      </div>
    </div>

    <div class="card message-card">
      <p id="displayMessage"></p>
    </div>

    <!-- Mini Game Section -->
    <div class="game-section">
      <h3>Catch the Hearts!</h3>
      <p>Score 10 to reveal the final message. Current Score: <span id="scoreDisplay">0</span></p>
      <div id="gameArea">
        <div id="target">❤️</div>
      </div>
    </div>
  </div>

  <!-- Win Overlay -->
  <div id="winOverlay" class="overlay hidden">
    <div class="card modal">
      <h2>🎉 You Won! 🎉</h2>
      <p>You caught all the hearts! Wishing you endless happiness, love, and memories together!</p>
      <button id="closeOverlayBtn" type="button">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
